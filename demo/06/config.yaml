model:
  name: "ResNet_Emotion_Optimized_v2"
  input_size: [1, 48, 48]
  output_dim: 7

  layers:
    # --- STEM LAYER ---
    - type: ConvBNAct
      conv:
        in_channels: 1
        out_channels: 32
        kernel_size: 3
        stride: 1
        padding: 1
      norm:
        name: batch_norm_2d
      act:
        type: 'silu'
        neg_slope: None

    # --- STAGE 1 (32 -> 64, 24x24) ---
    - type: ResNetBasicBlock
      in_channels: 32
      out_channels: 64
      stride: 2
      norm:
        name: batch_norm_2d
      act:
        type: 'silu'
        neg_slope: None

    # --- STAGE 2 (64 -> 128, 12x12) - 2 Blocks ---
    - type: ResNetBasicBlock  # Block 2.1 (Giảm kích thước)
      in_channels: 64
      out_channels: 128
      stride: 2
      norm:
        name: batch_norm_2d
      act:
        type: 'silu'
        neg_slope: None
    - type: ResNetBasicBlock  # Block 2.2 (Trích xuất thêm đặc trưng, stride=1)
      in_channels: 128
      out_channels: 128
      stride: 1
      norm:
        name: batch_norm_2d
      act:
        type: 'silu'
        neg_slope: None

    # --- STAGE 3 (128 -> 256, 6x6) - 2 Blocks ---
    - type: ResNetBasicBlock  # Block 3.1 (Giảm kích thước)
      in_channels: 128
      out_channels: 256
      stride: 2
      norm:
        name: batch_norm_2d
      act:
        type: 'silu'
        neg_slope: None
    - type: ResNetBasicBlock  # Block 3.2 (Trích xuất thêm đặc trưng, stride=1)
      in_channels: 256
      out_channels: 256
      stride: 1
      norm:
        name: batch_norm_2d
      act:
        type: 'silu'
        neg_slope: None

    # --- STAGE 4 (256 -> 256, 3x3) ---
    - type: ResNetBasicBlock
      in_channels: 256
      out_channels: 256
      stride: 2
      norm:
        name: batch_norm_2d
      act:
        type: 'silu'
        neg_slope: None

    # --- GLOBAL AVERAGE POOLING ---
    # Thay thế hoàn toàn Conv 3x3 pad 0 nặng nề. 
    # Ép [Batch, 256, 3, 3] -> [Batch, 256, 1, 1]
    - type: avgpool
      name: 'avgpool'
      kernel_size: 3
      stride: 1
      padding: 0

    # --- CLASSIFIER (FULLY CONNECTED) ---
    - type: fc
      in_features: 256
      out_features: 128
      
    - type: act
      type: 'silu'
      neg_slope: None
      
    - type: fc
      in_features: 128
      out_features: 7
      bias: True
      
train:
  dropout: {p: 0.5, inplace: false} # Tăng nhẹ dropout lên 0.5 để giảm Overfitting