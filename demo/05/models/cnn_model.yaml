model:
  type: Recognize_Emotions
  input_size:
  - 1
  - 48
  - 48
  output_dim: 7
  layers:
  - type: ConvBNAct
    conv:
      in_channels: 1
      out_channels: 32
      kernel_size: 3
      padding: 1
    act:
      type: silu
      neg_sloge: None
  - type: ConvBNAct
    conv:
      in_channels: 32
      out_channels: 32
      kernel_size: 3
      padding: 1
    act:
      type: silu
      neg_sloge: None
  - type: ConvBNAct
    conv:
      in_channels: 32
      out_channels: 64
      kernel_size: 3
      stride: 2
      padding: 1
    act:
      type: silu
      neg_sloge: None
  - type: ConvBNAct
    conv:
      in_channels: 64
      out_channels: 64
      kernel_size: 3
      padding: 1
    act:
      type: silu
      neg_sloge: None
  - type: ConvBNAct
    conv:
      in_channels: 64
      out_channels: 128
      kernel_size: 3
      padding: 1
    act:
      type: silu
      neg_sloge: None
  - type: ConvBNAct
    conv:
      in_channels: 128
      out_channels: 128
      kernel_size: 3
      stride: 2
      padding: 1
    act:
      type: silu
      neg_sloge: None
  - type: ConvBNAct
    conv:
      in_channels: 128
      out_channels: 256
      kernel_size: 3
      padding: 1
    act:
      type: silu
      neg_sloge: None
  - type: ConvBNAct
    conv:
      in_channels: 256
      out_channels: 256
      kernel_size: 3
      stride: 2
      padding: 1
    act:
      type: silu
      neg_sloge: None
  - type: ConvBNAct
    conv:
      in_channels: 256
      out_channels: 512
      kernel_size: 3
      padding: 1
    act:
      type: silu
      neg_sloge: None
  - type: ConvBNAct
    conv:
      in_channels: 512
      out_channels: 512
      kernel_size: 3
      stride: 2
      padding: 1
    act:
      type: silu
      neg_sloge: None
  - type: ConvBNAct
    conv:
      in_channels: 512
      out_channels: 512
      kernel_size: 3
      stride: 1
      padding: 0
    act:
      type: silu
      neg_sloge: None
  - type: fc
    in_features: 512
    out_features: 256
  - type: silu
    neg_sloge: None
  - type: fc
    in_features: 256
    out_features: 128
  - type: silu
    neg_sloge: None
  - type: fc
    in_features: 128
    out_features: 7
    bias: true
  train:
    dropout:
      p: 0.45
      inplace: false
  name: cnn_model
