[build-system]
requires = ["setuptools>=64.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cvnets"
version = "0.1.0"
description = "Clean-architecture CV neural network research framework"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0.0",
    "pyyaml>=6.0",
    "numpy>=1.24",
    "tqdm>=4.64",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "pytest-cov>=4.1", "torchvision>=0.15"]
demo = ["torchvision>=0.15", "pygame>=2.5"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["cvnets*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
